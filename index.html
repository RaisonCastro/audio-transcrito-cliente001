<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Áudio + Legenda</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #f2f2f2;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    .player-container {
      width: 100%;
      max-width: 900px;
      background: white;
      padding: 20px;
      border-radius: 14px;
      box-shadow: 0 6px 25px rgba(0,0,0,0.12);
    }

    .audio-wrapper {
      position: relative;
      width: 100%;
    }

    /* Área de legendas */
    .subtitle-display {
      background: #000;
      min-height: 120px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      border-radius: 8px 8px 0 0;
      margin-bottom: 10px;
    }

    .subtitle-text {
      color: white;
      font-size: 1.5em;
      font-weight: bold;
      text-align: center;
      text-shadow: 
        -2px -2px 0 #000,
        2px -2px 0 #000,
        -2px 2px 0 #000,
        2px 2px 0 #000,
        0px -2px 0 #000,
        0px 2px 0 #000,
        -2px 0px 0 #000,
        2px 0px 0 #000;
      line-height: 1.5;
      padding: 10px 20px;
      background-color: rgba(0, 0, 0, 0.8);
      border-radius: 4px;
    }

    audio {
      width: 100%;
      height: 54px;
      border-radius: 0 0 8px 8px;
    }

    /* Customiza o player de áudio */
    audio::-webkit-media-controls-panel {
      background-color: #2c3e50;
    }

    audio::-webkit-media-controls-play-button,
    audio::-webkit-media-controls-current-time-display,
    audio::-webkit-media-controls-time-remaining-display {
      color: white;
    }
  </style>
</head>
<body>

<div class="player-container">
  <div class="audio-wrapper">
    <!-- Área de exibição das legendas -->
    <div class="subtitle-display">
      <div class="subtitle-text" id="subtitleText">
        Carregando legendas...
      </div>
    </div>

    <!-- Player de áudio -->
    <audio id="audioPlayer" controls preload="metadata">
      <source src="WhatsApp Audio 2025-11-17 at 15.12.29.ogg" type="audio/ogg" />
      <track
        id="subtitleTrack"
        src="WhatsApp Audio 2025-11-17 at 15.12.29.vtt"
        kind="subtitles"
        srclang="pt"
        label="Português"
        default
      />
    </audio>
  </div>
</div>

<script>
  const audio = document.getElementById('audioPlayer');
  const subtitleText = document.getElementById('subtitleText');
  const track = document.getElementById('subtitleTrack').track;

  // Aguarda o carregamento das legendas
  track.mode = 'hidden'; // Esconde as legendas nativas
  
  track.addEventListener('load', function() {
    subtitleText.textContent = 'Pressione play para começar';
  });

  // Atualiza a legenda conforme o áudio toca
  track.addEventListener('cuechange', function() {
    const cues = track.activeCues;
    if (cues && cues.length > 0) {
      subtitleText.textContent = cues[0].text;
    } else {
      subtitleText.textContent = '';
    }
  });

  // Fallback caso as legendas não carreguem
  audio.addEventListener('loadedmetadata', function() {
    if (track.cues && track.cues.length === 0) {
      subtitleText.textContent = 'Aguardando áudio...';
    }
  });
</script>

</body>
</html>
